<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe - KAWKAB AL OULOUM</title>
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="reset-password-container">
        <div class="reset-password-card">
            <div class="reset-password-header">
                <h1><i class="fas fa-key"></i> Définir un nouveau mot de passe</h1>
                <p>Votre nouveau mot de passe doit être sécurisé</p>
            </div>

            <div id="resetMessage" class="reset-message" style="display: none;"></div>

            <form id="resetPasswordForm" class="login-form">
                <input type="hidden" id="resetToken" name="token" value="">
                <input type="hidden" id="resetEmail" name="email" value="">

                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-lock"></i>
                        Nouveau mot de passe
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" name="new_password" required
                               placeholder="Min. 8 caractères" minlength="8"
                               autocomplete="new-password">
                        <button class="password-toggle" type="button" data-toggle-target="newPassword"
                                aria-label="Afficher le mot de passe" aria-pressed="false">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="password-strength-meter">
                        <div id="passwordStrengthBar" class="strength-bar"></div>
                    </div>
                    <small id="passwordHint" class="form-hint">Utilisez au moins 8 caractères avec des lettres et des chiffres</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i>
                        Confirmer le mot de passe
                    </label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" name="confirm_password" required
                               placeholder="Retapez le mot de passe" autocomplete="new-password">
                        <button class="password-toggle" type="button" data-toggle-target="confirmPassword"
                                aria-label="Afficher le mot de passe" aria-pressed="false">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <i class="fas fa-save"></i>
                    Réinitialiser le mot de passe
                </button>
            </form>

            <div class="login-links">
                <a href="login.html">
                    <i class="fas fa-arrow-left"></i>
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');

            const tokenInput = document.getElementById('resetToken');
            const emailInput = document.getElementById('resetEmail');
            const form = document.getElementById('resetPasswordForm');
            const messageDiv = document.getElementById('resetMessage');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const strengthBar = document.getElementById('passwordStrengthBar');

            if (!token || !email) {
                showMessage('Lien invalide ou expiré. Veuillez demander une nouvelle réinitialisation.', 'error');
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            tokenInput.value = token;
            emailInput.value = email;

            document.querySelectorAll('.password-toggle').forEach(button => {
                button.addEventListener('click', () => {
                    const targetId = button.getAttribute('data-toggle-target');
                    const input = document.getElementById(targetId);
                    const icon = button.querySelector('i');

                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                        button.setAttribute('aria-pressed', 'true');
                    } else {
                        input.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                        button.setAttribute('aria-pressed', 'false');
                    }
                });
            });

            newPasswordInput.addEventListener('input', () => {
                const password = newPasswordInput.value;
                const strength = calculatePasswordStrength(password);
                strengthBar.style.width = strength.percentage + '%';
                strengthBar.className = 'strength-bar ' + strength.class;
            });

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const submitButton = document.getElementById('submitBtn');
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (newPassword.length < 8) {
                    showMessage('Le mot de passe doit contenir au moins 8 caractères.', 'error');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showMessage('Les mots de passe ne correspondent pas.', 'error');
                    return;
                }

                const initialButtonHtml = submitButton.innerHTML;
                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Réinitialisation...';
                clearMessage();

                try {
                    const response = await fetch('backend/reset_password.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({
                            token: token,
                            email: email,
                            new_password: newPassword
                        }),
                    });

                    const payload = await response.json();

                    if (payload.success) {
                        showMessage(payload.message || 'Mot de passe réinitialisé avec succès. Vous pouvez maintenant vous connecter.', 'success');
                        form.reset();
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3000);
                    } else {
                        showMessage(payload.message || 'Erreur lors de la réinitialisation.', 'error');
                        submitButton.disabled = false;
                        submitButton.innerHTML = initialButtonHtml;
                    }
                } catch (error) {
                    console.error('Reset password error:', error);
                    showMessage('Erreur réseau. Veuillez réessayer.', 'error');
                    submitButton.disabled = false;
                    submitButton.innerHTML = initialButtonHtml;
                }
            });

            function calculatePasswordStrength(password) {
                let score = 0;
                if (password.length >= 8) score += 25;
                if (password.length >= 12) score += 10;
                if (/[a-z]/.test(password)) score += 15;
                if (/[A-Z]/.test(password)) score += 15;
                if (/[0-9]/.test(password)) score += 15;
                if (/[^a-zA-Z0-9]/.test(password)) score += 20;

                if (score >= 80) return { percentage: 100, class: 'strength-excellent' };
                if (score >= 60) return { percentage: 80, class: 'strength-good' };
                if (score >= 40) return { percentage: 60, class: 'strength-medium' };
                return { percentage: 40, class: 'strength-weak' };
            }

            function showMessage(message, type) {
                messageDiv.style.display = 'block';
                messageDiv.className = `reset-message ${type === 'success' ? 'success-message' : 'error-message'}`;
                messageDiv.innerHTML = `<strong>${type === 'success' ? 'Succès' : 'Erreur'} :</strong> ${message}`;
            }

            function clearMessage() {
                messageDiv.style.display = 'none';
                messageDiv.className = 'reset-message';
                messageDiv.innerHTML = '';
            }
        });
    </script>
</body>
</html>
