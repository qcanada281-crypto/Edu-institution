# SonarQube Project Configuration
sonar.projectKey=edu-institution
sonar.projectName=Edu-Institution
sonar.projectVersion=1.0

# Source files to scan
sonar.sources=.

# Exclude media, uploads, vendor, background setup scripts, and editor configs
sonar.exclusions=uploads/**,images/**,.git/**,.vscode/**,.cursor/**,.kilo/**,.sixth/**,.vercel/**,backend/bg/**,**/*.json,**/*.txt

# Encoding
sonar.sourceEncoding=UTF-8
