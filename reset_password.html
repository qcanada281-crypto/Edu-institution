<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du Mot de passe - KAWKAB AL OULOU</title>
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/school-64 (1).png">
    <style>
        .reset-card {
            max-width: 480px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 35px 30px;
        }
        .reset-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .reset-header img {
            height: 70px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .reset-header h2 {
            font-family: 'Tajawal', sans-serif;
            font-size: 24px;
            color: #3e2723;
            margin-bottom: 8px;
        }
        .reset-header p {
            font-size: 14px;
            color: #6d5450;
            line-height: 1.5;
        }
        .info-box {
            background: rgba(196, 154, 108, 0.1);
            border-left: 4px solid #c49a6c;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            color: #3e2723;
            margin-bottom: 20px;
        }
        .info-box i {
            color: #c49a6c;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="reset-card">
            <div class="reset-header">
                <img src="images/kawkab_alouloum.jpeg" alt="KAWKAB AL OULOUM" onerror="this.style.display='none'">
                <h2>Récupération d'Accès</h2>
                <p>Demande de réinitialisation d'accès au portail élève</p>
            </div>

            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                Le portail élève s'utilise directement avec votre <strong>Code élève</strong> et votre <strong>Date de naissance</strong>. En cas de perte de vos identifiants, vous pouvez envoyer une demande directe à l'administration.
            </div>

            <form id="resetForm" class="login-form">
                <div class="form-group">
                    <label for="resetStudentCode">
                        <i class="fas fa-id-card"></i>
                        Code Élève / Code Massar *
                    </label>
                    <input type="text" id="resetStudentCode" name="student_code" required 
                           placeholder="Ex: STU2026001 ou Code Massar">
                </div>

                <div class="form-group">
                    <label for="resetEmail">
                        <i class="fas fa-envelope"></i>
                        Email du tuteur / élève *
                    </label>
                    <input type="email" id="resetEmail" name="email" required 
                           placeholder="exemple@email.com">
                </div>

                <div class="form-group">
                    <label for="resetPhone">
                        <i class="fas fa-phone"></i>
                        Numéro de Téléphone *
                    </label>
                    <input type="tel" id="resetPhone" name="phone" required 
                           placeholder="06XXXXXXXX">
                </div>

                <button type="submit" class="btn-login" style="margin-top: 15px;">
                    <i class="fas fa-paper-plane"></i>
                    Envoyer la Demande
                </button>

                <div id="resetFeedback" class="login-feedback" aria-live="polite" style="margin-top: 15px;"></div>
            </form>

            <div class="login-links" style="margin-top: 25px; text-align: center;">
                <a href="login.html" class="forgot-password-link" style="margin-right: 15px;">
                    <i class="fas fa-arrow-left"></i>
                    Retour à la connexion
                </a>
                <a href="index.html" class="back-link">
                    <i class="fas fa-home"></i>
                    Accueil
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var feedback = document.getElementById('resetFeedback');
            var form = this;
            
            feedback.className = 'login-feedback';
            feedback.style.display = 'block';
            feedback.style.background = '#e8f0fe';
            feedback.style.color = '#1a73e8';
            feedback.style.padding = '12px';
            feedback.style.borderRadius = '8px';
            feedback.style.marginTop = '15px';
            feedback.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi de la demande à l\'administration...';

            try {
                var formData = new FormData(form);
                var response = await fetch('backend/reset_password.php', {
                    method: 'POST',
                    body: formData
                });
                var result = await response.json();
                
                if (result.success) {
                    feedback.style.background = '#e6f4ea';
                    feedback.style.color = '#137333';
                    feedback.innerHTML = '<i class="fas fa-check-circle"></i> ' + (result.message || 'Votre demande de récupération a été transmise à l\'administration de l\'établissement. Vous serez contacté sous peu.');
                    form.reset();
                } else {
                    feedback.style.background = '#fce8e6';
                    feedback.style.color = '#c5221f';
                    feedback.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + (result.message || 'Une erreur est survenue lors de l\'envoi.');
                }
            } catch (err) {
                feedback.style.background = '#fce8e6';
                feedback.style.color = '#c5221f';
                feedback.innerHTML = '<i class="fas fa-exclamation-circle"></i> Erreur de connexion au serveur.';
            }
        });
    </script>
</body>
</html>
