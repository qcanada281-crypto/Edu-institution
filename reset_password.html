<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe - KAWKAB AL OULOUM</title>
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="reset-password-container">
        <div class="reset-password-card">
            <div class="reset-password-header">
                <h1><i class="fas fa-key"></i> Réinitialisation du mot de passe</h1>
                <p>Entrez votre adresse email pour réinitialiser votre mot de passe</p>
            </div>

            <div id="resetMessage" class="reset-message" style="display: none;"></div>

            <div class="admin-login-note">
                <strong><i class="fas fa-info-circle"></i> Note :</strong> Cette fonctionnalité est réservée aux administrateurs et enseignants. Les étudiants et parents utilisent le code élève + date de naissance pour se connecter.
            </div>

            <form id="resetPasswordForm" class="login-form">
                <div class="form-group">
                    <label for="resetEmail">
                        <i class="fas fa-envelope"></i>
                        Adresse Email
                    </label>
                    <input type="email" id="resetEmail" name="email" required 
                           placeholder="admin@kawkab-ouloum.ma">
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-paper-plane"></i>
                    Envoyer le lien de réinitialisation
                </button>
            </form>

            <div class="login-links">
                <a href="login.html">
                    <i class="fas fa-arrow-left"></i>
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('resetPasswordForm');
            const messageDiv = document.getElementById('resetMessage');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const emailInput = document.getElementById('resetEmail');
                const submitButton = form.querySelector('button[type="submit"]');
                const email = emailInput.value.trim();

                if (!email) {
                    showMessage('Veuillez entrer votre adresse email.', 'error');
                    return;
                }

                const initialButtonHtml = submitButton.innerHTML;
                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';
                clearMessage();

                try {
                    const response = await fetch('backend/forgot_password.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        body: JSON.stringify({ email: email }),
                    });

                    const payload = await response.json();
                    
                    if (payload.success) {
                        showMessage(payload.message || 'Email envoyé avec succès. Vérifiez votre boîte de réception.', 'success');
                        form.reset();
                    } else {
                        showMessage(payload.message || 'Erreur lors de l\'envoi de l\'email. Vérifiez l\'adresse email.', 'error');
                    }
                } catch (error) {
                    console.error('Reset password error:', error);
                    showMessage('Erreur réseau. Veuillez réessayer.', 'error');
                } finally {
                    submitButton.disabled = false;
                    submitButton.innerHTML = initialButtonHtml;
                }
            });

            function showMessage(message, type) {
                messageDiv.style.display = 'block';
                messageDiv.className = `reset-message ${type === 'success' ? 'success-message' : 'error-message'}`;
                messageDiv.innerHTML = `<strong>${type === 'success' ? 'Succès' : 'Erreur'} :</strong> ${message}`;
            }

            function clearMessage() {
                messageDiv.style.display = 'none';
                messageDiv.className = 'reset-message';
                messageDiv.innerHTML = '';
            }
        });
    </script>
</body>
</html>
